name: keepalive
# Touches the database every 8 hours so the Supabase project never auto-pauses, and checks the live site.
on:
  schedule: [{ cron: '17 */8 * * *' }]
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Health
        run: |
          curl -fsS --retry 3 --max-time 30 "$APP_URL/api/health" | tee /dev/stderr | grep -q '"ok":true'
        env:
          APP_URL: ${{ vars.APP_URL }}
      - name: Keep database warm
        run: |
          curl -fsS --retry 3 --max-time 30 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/keepalive"
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
